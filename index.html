<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>크보덕아웃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Oswald:wght@500;700&display=swap">
<style>
/* Layout: an iPhone shell — status bar, one scrolling screen (home / browser / messenger), home indicator.
   The board lives inside the browser screen; the messenger is its own screen. Single committed look. */
:root{
  --paper:#ffffff;
  --board:#e9ebf0;
  --ink:#16181d;
  --navy:#2f3c74;
  --navy-deep:#222c58;
  --line:#dcdfe6;
  --line-soft:#eceef3;
  --muted:#7b8292;
  --link:#1f2d57;
  --hot:#c0392b;
  --ghost:#aab0bb;
  --ad:#fcf7e6;
  --ad-line:#eadfb8;
  --ktalk:#b2c7d9;
  --kyellow:#fae100;
  --stage:#0d1016;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--stage);
  color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.6;
  -webkit-text-size-adjust:100%;
  word-break:keep-all;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #5a86d8;outline-offset:1px}

/* ---------- device ---------- */
.device{
  position:relative;width:100%;height:100%;max-width:430px;
  display:flex;flex-direction:column;overflow:hidden;background:#000;
}
.device.s-home{
  background:
    radial-gradient(130% 62% at 14% 2%, #8adfd6 0%, rgba(138,223,214,0) 52%),
    radial-gradient(90% 55% at 95% 28%, rgba(74,155,186,.5) 0%, rgba(74,155,186,0) 62%),
    linear-gradient(168deg,#2b8296 0%,#215f87 28%,#1a3c6b 58%,#101d40 100%);
}
.device.s-browser{background:#fff;--topbg:#f3f3f4;--botbg:#fff}
.device.s-talk{background:var(--ktalk);--topbg:var(--ktalk);--botbg:#fff}
@media(min-width:470px) and (min-height:760px){
  .device{height:min(100%,884px);border-radius:46px;box-shadow:0 0 0 10px #1b1e24,0 0 0 12px #2e333c,0 30px 80px rgba(0,0,0,.6)}
}
.status{
  flex:none;position:relative;z-index:12;display:flex;align-items:center;
  height:50px;padding-top:env(safe-area-inset-top,0px);
  padding-left:max(26px,env(safe-area-inset-left,0px));
  padding-right:max(22px,env(safe-area-inset-right,0px));
  font-size:15px;font-weight:600;letter-spacing:.2px;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  color:#fff;background:var(--topbg,transparent);transition:color .25s;
}
.status.dark{color:#111}
.status .isl{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 9px);
  width:104px;height:30px;border-radius:16px;background:#000;
}
@media(max-width:469px){.status .isl{display:none}}
.status .rt{margin-left:auto;display:flex;align-items:center;gap:6px}
.status .bars{display:flex;gap:2px;align-items:flex-end}
.status .bars i{display:block;width:3px;background:currentColor;border-radius:1px}
.status .bars i:nth-child(1){height:4px}.status .bars i:nth-child(2){height:6px}
.status .bars i:nth-child(3){height:8px}.status .bars i:nth-child(4){height:10px}
.status .bt{width:23px;height:11.5px;border:1.4px solid currentColor;border-radius:3.2px;position:relative;padding:1.4px;opacity:.95}
.status .bt::after{content:"";position:absolute;right:-3.6px;top:3.4px;width:2px;height:4.6px;background:currentColor;border-radius:0 1.4px 1.4px 0;opacity:.6}
.status .bt u{display:block;height:100%;width:62%;background:currentColor;border-radius:1.6px}

.stage{flex:1;position:relative;overflow:hidden;background:transparent}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;transform-origin:50% 46%}
#home{z-index:0}
#browser,#talk{z-index:1}
.view.closing{z-index:5;pointer-events:none;animation:appClose .44s cubic-bezier(.32,.72,0,1) forwards}
.view.launching{animation:appOpen .4s cubic-bezier(.32,.72,0,1)}
@keyframes appClose{
  0%{transform:scale(1);opacity:1;border-radius:0}
  70%{opacity:.5}
  100%{transform:scale(.56) translateY(7%);opacity:0;border-radius:46px}
}
@keyframes appOpen{
  from{transform:scale(.6) translateY(7%);opacity:0;border-radius:46px}
  to{transform:none;opacity:1;border-radius:0}
}
#home.opening .widgets,#home.opening .grid,#home.opening .dock,
#home.opening .srchpill,#home.opening .pages{animation:homeIn .44s cubic-bezier(.32,.72,0,1) backwards}
@keyframes homeIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .view.closing,.view.launching,#home.opening .widgets,#home.opening .grid,
  #home.opening .dock,#home.opening .srchpill,#home.opening .pages{animation:none}
  .view.closing{opacity:0}
}

.hbar{
  flex:none;position:relative;z-index:12;height:26px;
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;place-items:center;touch-action:none;background:var(--botbg,transparent);
}
.hbar button{width:138px;height:5px;border-radius:3px;background:#fff;border:none;opacity:.92;padding:0}
.hbar.dark button{background:#111;opacity:.32}
.hint{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:30;
  background:rgba(18,21,28,.82);color:#fff;font-size:11.5px;padding:6px 13px;border-radius:14px;
  pointer-events:none;animation:fade 4s ease forwards;
}
@keyframes fade{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}

/* ---------- home screen ---------- */
#home{background:transparent;padding-top:14px}
.homenote{align-self:center;margin:6px 18px 0;padding:6px 14px;border-radius:14px;
  background:rgba(10,18,36,.32);backdrop-filter:blur(10px);
  color:rgba(255,255,255,.93);font-size:11.5px;letter-spacing:-.2px;
  text-shadow:0 1px 3px rgba(0,0,0,.3)}
.pages{display:flex;justify-content:center;gap:7px;margin-top:auto;padding-bottom:9px}
.pages i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.42)}
.pages i.on{background:#fff}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 18px 22px}
.wgt{aspect-ratio:1/1;border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden}
.wgt.wx{background:rgba(78,142,185,.5);backdrop-filter:blur(16px);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.wgt.wx b{font-size:15px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.wtemp{font-size:48px;font-weight:200;line-height:1.02;margin-top:1px;letter-spacing:-2.5px}
.wcond{margin-top:auto;font-size:12.5px;opacity:.95}
.whl{font-size:12.5px;opacity:.95}
.wgt.cal{background:#fff;color:#1b1b1b;box-shadow:0 6px 20px rgba(0,0,0,.16)}
.cdow{font-size:13px;font-weight:700;color:#ff3b30;letter-spacing:-.3px}
.cday{font-size:42px;font-weight:600;letter-spacing:-2px;line-height:1.08}
.cev{margin-top:auto;font-size:12.5px;color:#5c6069;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:8px 18px 0}
.app{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.app .ic{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 7px rgba(0,0,0,.26);overflow:hidden;position:relative}
.app .lb{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px}
.app .bg{position:absolute;top:-4px;right:2px;min-width:21px;height:21px;border-radius:11px;background:#ff3b30;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 1.6px rgba(255,255,255,.5)}
.app.live .ic{cursor:pointer}
.app.dim .ic{opacity:.97}
.app.dim{cursor:default}
.srchpill{display:flex;justify-content:center;padding-bottom:10px}
.srchpill span{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#fff;font-size:12.5px;padding:5px 13px;border-radius:14px}
.dock{margin:0 10px;padding:12px 10px;border-radius:30px;background:rgba(255,255,255,.2);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.dock .app .lb{display:none}

/* ---------- browser chrome ---------- */
#browser{background:var(--board)}
.cbar{position:sticky;top:0;z-index:14;flex:none;background:#f3f3f4;border-bottom:1px solid #d9dadd;display:flex;align-items:center;gap:9px;padding:8px 12px}
.cbar .url{flex:1;min-width:0;display:flex;align-items:center;gap:5px;background:#e4e5e8;border-radius:16px;padding:6px 12px;font-size:12.5px;color:#43474e}
.cbar .url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .ib{background:none;border:none;color:#5b6069;padding:2px;display:grid;place-items:center}
.cbar .tabs{border:1.8px solid #5b6069;border-radius:4px;width:19px;height:19px;font-size:11px;font-weight:700;color:#5b6069;display:grid;place-items:center;background:none}
.page{background:var(--paper);flex:1}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* ---------- board ---------- */
.brand{background:var(--navy-deep);color:#fff}
.brand .in{display:flex;align-items:center;gap:10px;padding-block:9px}
.brand .mk{display:flex;align-items:baseline;gap:6px}
.brand .mk b{font-size:17px;letter-spacing:-.02em}
.brand .mk i{font-style:normal;font-family:Oswald,sans-serif;font-size:9px;letter-spacing:.2em;color:#93a1cb}
.brand .sp{margin-left:auto;display:flex;gap:14px;align-items:center;color:#b8c2de}
.brand .sp svg{display:block}
.btabs{display:flex;background:var(--navy);overflow-x:auto;scrollbar-width:none}
.btabs::-webkit-scrollbar{display:none}
.btabs button{background:none;border:none;color:#aab6d8;font-size:13px;padding:10px 15px;white-space:nowrap;border-bottom:2.5px solid transparent}
.btabs button.on{color:#fff;font-weight:700;border-bottom-color:#fff}
.btabs button.off{color:#6c7aa6}

.tick{display:flex;overflow-x:auto;background:#f6f7fa;border-bottom:1px solid var(--line);scrollbar-width:none}
.tick::-webkit-scrollbar{display:none}
.tick .d{flex:none;font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.1em;color:var(--muted);display:grid;place-items:center;padding:0 12px;border-right:1px solid var(--line-soft)}
.tick .g{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;font-size:12px;white-space:nowrap;border-right:1px solid var(--line-soft)}
.tick .g .s{font-family:Oswald,sans-serif;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tick .g .w{font-weight:700}
.tick .g .n{font-size:9.5px;color:var(--ghost);border:1px solid var(--line);padding:0 4px;border-radius:2px}

.ghead{display:flex;align-items:center;gap:8px;padding-block:13px 11px;border-bottom:1px solid var(--line-soft)}
.ghead h1{margin:0;font-size:17px;letter-spacing:-.03em}
.ghead .c{font-family:Oswald,sans-serif;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead .w{margin-left:auto;background:var(--navy);border:none;color:#fff;font-size:12px;font-weight:700;padding:6px 13px;border-radius:3px}
.ad{display:flex;gap:9px;align-items:flex-start;margin-block:10px;padding:10px 12px;background:var(--ad);border:1px solid var(--ad-line);border-radius:4px;font-size:12px;color:#6d5f35;line-height:1.5}
.ad .t{flex:none;font-family:Oswald,sans-serif;font-size:9px;letter-spacing:.1em;border:1px solid var(--ad-line);padding:1px 4px;border-radius:2px;color:#8a7536;margin-top:1px}
.nts{border-top:1px solid var(--line-soft)}
.nt{display:flex;gap:8px;align-items:flex-start;padding-block:9px;border-bottom:1px solid var(--line-soft);font-size:12.5px;background:#fafbfd;line-height:1.5}
.nt .p{flex:none;font-size:10px;font-weight:700;color:var(--navy);background:#e8ecf7;border:1px solid #c6cfe6;padding:1px 5px;border-radius:2px;margin-top:1px}
.nt .s{margin-left:auto;flex:none;color:var(--ghost);font-size:10.5px;font-variant-numeric:tabular-nums;padding-left:6px}
.nt.fresh .s{color:var(--hot)}
.rail{display:flex;gap:5px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;background:#f1f3f7;border:1px solid transparent;color:#5d6475;font-size:12px;padding:4px 11px;border-radius:13px;white-space:nowrap}
.rail button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

.rows{border-bottom:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line-soft);padding-block:11px;color:inherit;font-family:inherit}
.row:active{background:#f4f6fa}

.row.lock{cursor:default}
.row.lock:active{background:none}

.row .l1{font-size:14px;line-height:1.5;color:var(--link)}
.row .cat{display:inline-block;font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:0 4px;border-radius:2px;vertical-align:2px;margin-right:5px}
.row .flag{display:inline-block;font-size:10px;font-weight:700;color:var(--hot);border:1px solid #e4b9b3;background:#fdf3f1;padding:0 4px;border-radius:2px;vertical-align:2px;margin-right:5px}
.row .cm{color:var(--hot);font-family:Oswald,sans-serif;font-size:12px;font-variant-numeric:tabular-nums;margin-left:4px}
.row .l2{display:flex;gap:7px;align-items:baseline;margin-top:5px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.row .l2 .n{font-variant-numeric:tabular-nums}
.row .l1{font-weight:700}
.row.hot .l1{color:#1b2a52}
.row.gone .l1{font-weight:400}
.row.lock .l1{font-weight:400;color:#4a5160}
.row.hot .l2 .v{color:var(--hot);font-weight:700}
.row.read .l1{color:#878d9b}
.row.gone{color:var(--ghost);font-size:12.5px;font-style:italic;background:#fbfbfc;cursor:default}
.row.gone:active{background:#fbfbfc}

.pager{display:flex;justify-content:center;gap:4px;padding-block:14px}
.pager button{background:var(--paper);border:1px solid var(--line);color:#5d6475;font-size:12px;min-width:28px;height:28px;border-radius:3px;font-family:Oswald,sans-serif}
.pager button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.srch{display:flex;gap:5px;padding-block:0 16px}
.srch select,.srch input{border:1px solid var(--line);border-radius:3px;padding:7px 9px;font-size:12px;font-family:inherit;background:var(--paper);color:var(--ink);min-width:0}
.srch input{flex:1}
.srch .go{background:#f1f3f7;border:1px solid var(--line);color:#5d6475;font-size:12px;padding:0 12px;border-radius:3px}
.foot{padding-block:20px 30px;text-align:center;color:var(--muted);font-size:11px;line-height:1.85;border-top:1px solid var(--line-soft)}
.foot .g{display:inline-block;border:1px solid var(--line);background:#fafbfd;border-radius:4px;padding:9px 13px;color:#5d6475}
.foot .g b{color:var(--navy)}

/* ---------- post ---------- */
.pbar{position:sticky;top:49px;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-block:9px}
.pbar button{background:none;border:none;color:#3d4454;font-size:13px;padding:3px 2px;display:flex;align-items:center;gap:5px}
.pbar .ttl{font-size:13px;font-weight:700;color:var(--navy);margin-left:2px}
.ph{padding-block:15px 12px;border-bottom:1px solid var(--line-soft)}
.ph .cat{font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:1px 5px;border-radius:2px}
.ph .kn{font-size:10.5px;color:var(--hot);border:1px solid #e4b9b3;padding:1px 5px;border-radius:2px;margin-left:4px}
.ph h2{margin:9px 0 10px;font-size:17px;line-height:1.45;letter-spacing:-.025em;text-wrap:balance}
.ph .m{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:11px;align-items:baseline}
.ph .m .w{color:#3d4454;font-weight:500}
.ph .m .n{font-variant-numeric:tabular-nums}
.pb{padding-block:18px 24px;font-size:14.5px;line-height:1.95;white-space:pre-line}
.vt{display:flex;gap:8px;justify-content:center;padding-bottom:20px}
.vt button{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:8px 20px;color:#5d6475;font-size:11px}
.vt button b{font-family:Oswald,sans-serif;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.vt button.up.done{border-color:var(--hot);color:var(--hot)}
.vt button.up.done b{color:var(--hot)}
.cw{border-top:1px solid var(--line);background:#fbfcfd}
.ch{padding-block:11px;font-size:12.5px;color:#3d4454;border-bottom:1px solid var(--line-soft)}
.ch b{font-family:Oswald,sans-serif;color:var(--hot);font-variant-numeric:tabular-nums}
.cmt{padding-block:10px;border-bottom:1px solid var(--line-soft);font-size:13px}
.cmt .h{display:flex;gap:7px;align-items:baseline;margin-bottom:3px}
.cmt .nk{color:#5d6475;font-size:11px}
.cmt .tm{margin-left:auto;color:var(--ghost);font-size:10px;font-variant-numeric:tabular-nums}
.cmt .tx{line-height:1.65}
.cmt.adm{background:#eff3fb}
.cmt.adm .nk{color:var(--navy);font-weight:700}
.cmt.op .nk{color:var(--hot)}
.cmt.re .tx{color:#717886}
/* ---------- 글쓰기 ---------- */
.wbar{position:sticky;top:49px;z-index:10;display:flex;align-items:center;gap:8px;background:var(--paper);border-bottom:1px solid var(--line);
  padding:9px max(14px,env(safe-area-inset-right,0px)) 9px max(14px,env(safe-area-inset-left,0px))}
.wbar b{font-size:15px;letter-spacing:-.02em}
.wbar button{background:none;border:none;color:#5d6475;font-size:16px;line-height:1;padding:4px 6px}
.wbar .submit{margin-left:auto;background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:4px}
.wbar .submit[disabled]{background:#c7ccd8;cursor:default}
.wcat{display:flex;gap:5px;overflow-x:auto;padding-block:11px;border-bottom:1px solid var(--line-soft);scrollbar-width:none}
.wcat::-webkit-scrollbar{display:none}
.wcat button{flex:none;background:#f1f3f7;border:1px solid transparent;color:#5d6475;font-size:12px;padding:5px 12px;border-radius:13px;white-space:nowrap}
.wcat button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.wline{display:flex;gap:7px;padding-block:10px;border-bottom:1px solid var(--line-soft)}
.wline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:13px;font-family:inherit;background:var(--paper);color:var(--ink)}
.wtitle{width:100%;border:none;border-bottom:1px solid var(--line-soft);padding:14px 2px;font-size:16px;font-weight:700;font-family:inherit;background:none;color:var(--ink);letter-spacing:-.02em}
.wbody{width:100%;border:none;resize:none;min-height:240px;padding:14px 2px;font-size:14.5px;line-height:1.9;font-family:inherit;background:none;color:var(--ink)}
.wline input:focus,.wtitle:focus,.wbody:focus{outline:none}
.wtitle:focus{border-bottom-color:var(--navy)}
.wnotice{font-size:11px;color:var(--muted);line-height:1.7;background:#f7f8fb;border-radius:5px;padding:10px 12px;margin-bottom:16px}
.wtools{position:sticky;bottom:0;display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);background:#fafbfd;color:#8a909c;
  padding:9px max(14px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.wtools button{background:none;border:none;color:inherit;padding:2px;display:grid;place-items:center}
.wcount{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums}
.cnav{display:flex;gap:6px;padding-block:14px}
.cnav button{flex:1;background:#f1f3f7;border:1px solid var(--line);color:#5d6475;font-size:12.5px;padding:9px 0;border-radius:4px}
.cnav button[disabled]{color:#b9bec8;background:#f8f9fb;cursor:default}

/* ---------- messenger ---------- */
#talk{background:var(--ktalk)}
.khd{position:sticky;top:0;z-index:10;flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px 8px;background:var(--ktalk)}
.khd .bk{background:none;border:none;color:#1b1b1b;padding:6px 7px;display:grid;place-items:center}
.khd .nm{font-size:17px;font-weight:700;letter-spacing:-.4px;color:#1b1b1b}
.khd .rt{margin-left:auto;display:flex;gap:4px}
.khd .rt button{background:none;border:none;color:#1b1b1b;padding:6px 7px;display:grid;place-items:center}
.kmsgs{flex:1;padding:6px 12px 10px;display:flex;flex-direction:column;gap:9px}
.kdate{align-self:center;background:rgba(0,0,0,.14);color:#f4f6f8;font-size:11.5px;padding:3px 13px;border-radius:12px;margin:6px 0 4px}
.kmsg{display:flex;gap:8px;align-items:flex-end}
.kmsg.cont{padding-left:48px}
@media(prefers-reduced-motion:reduce){#notif{transition:none}}
.kmsg .av{width:40px;height:40px;border-radius:15px;flex:none;align-self:flex-start;overflow:hidden;background:#cfd8e2;display:grid;place-items:center}
.kmsg .col{min-width:0;max-width:72%}
.kmsg .nm{font-size:12px;color:#3a3a3a;margin:0 0 4px 2px}
.kmsg .ln{display:flex;gap:5px;align-items:flex-end}
.kbub{background:#fff;border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14.5px;line-height:1.45;color:#1b1b1b;word-break:break-word}
.kmsg .tm{font-size:10.5px;color:#4a5968;white-space:nowrap;flex:none;padding-bottom:2px}
.kmsg.me{flex-direction:row-reverse}
.kmsg.me .col{margin-left:auto}
.kmsg.me .ln{flex-direction:row-reverse}
.kmsg.me .kbub{background:var(--kyellow);border-radius:14px 4px 14px 14px}
.kmsg.me .mt{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.kmsg.me .un{font-size:10.5px;color:#f0c000;font-weight:700;line-height:1.3}
.kin{position:sticky;bottom:0;flex:none;display:flex;gap:8px;align-items:flex-end;padding:7px 10px;background:#fff}
.kin .plus{background:none;border:none;color:#5a5a5a;padding:6px;flex:none;display:grid;place-items:center}
.kin .box{flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px}
.kin textarea{flex:1;min-width:0;border:none;resize:none;font-family:inherit;font-size:15px;line-height:1.45;max-height:88px;color:var(--ink);background:none;padding:7px 0}
.kin textarea:focus{outline:none}
.kin .send{background:#eceef0;border:none;color:#9b9ea4;font-size:13px;font-weight:700;padding:7px 13px;border-radius:15px;flex:none}
.kin .send.live{background:var(--kyellow);color:#3b3300}

/* ---------- notification ---------- */
#notif{
  position:absolute;left:50%;transform:translateX(-50%) translateY(-180%);
  top:calc(env(safe-area-inset-top,0px) + 56px);z-index:40;
  width:calc(100% - 24px);max-width:406px;
  background:rgba(246,246,248,.82);backdrop-filter:blur(22px);
  color:#111;border-radius:20px;padding:11px 14px;display:flex;gap:11px;align-items:center;
  text-align:left;border:none;box-shadow:0 10px 30px rgba(0,0,0,.28);
  transition:transform .55s cubic-bezier(.2,.9,.3,1.1);
}
#notif.in{transform:translateX(-50%) translateY(0)}
#notif .ic{width:38px;height:38px;border-radius:10px;flex:none;background:var(--kyellow);display:grid;place-items:center}
#notif .b{min-width:0;flex:1}
#notif .r1{display:flex;align-items:baseline;gap:7px}
#notif .r1 b{font-size:13px;letter-spacing:-.2px}
#notif .r1 i{font-style:normal;font-size:11.5px;color:#6b6f78;margin-left:auto}
#notif .r2{font-size:14px;color:#2b2e34;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}

/* ─────────── screens ─────────── */
var SCREENS = { home: $("home"), browser: $("browser"), talk: $("talk") };
var current = "home";
var animating = false;
function go(name, noAnim){
  if(animating) return;
  if(name === current && !noAnim) return;
  var prevEl = SCREENS[current], nextEl = SCREENS[name];
  if(name === "talk"){
    talkSeen = true;
    hideNotif();
    buildTalk();
  }
  nextEl.hidden = false;
  current = name;
  document.querySelector(".device").className = "device s-" + name;
  var dark = (name !== "home");
  $("status").classList.toggle("dark", dark);
  $("hbar").classList.toggle("dark", dark);
  if(name === "home") renderHome();

  if(noAnim || !prevEl || prevEl === nextEl){
    Object.keys(SCREENS).forEach(function(k){ SCREENS[k].hidden = (k !== name); });
  } else if(name === "home"){
    animating = true;                                  // 앱이 아이콘으로 빨려들어감
    prevEl.classList.add("closing");
    nextEl.classList.add("opening");
    setTimeout(function(){
      prevEl.classList.remove("closing");
      prevEl.hidden = true;
      nextEl.classList.remove("opening");
      animating = false;
    }, 450);
  } else {
    animating = true;                                  // 앱이 펼쳐지며 열림
    Object.keys(SCREENS).forEach(function(k){
      if(k !== name && k !== "home") SCREENS[k].hidden = true;
    });
    nextEl.classList.add("launching");
    setTimeout(function(){
      nextEl.classList.remove("launching");
      SCREENS.home.hidden = true;
      animating = false;
    }, 420);
  }

  if(name === "talk"){
    var sc = SCREENS.talk;
    sc.scrollTop = sc.scrollHeight;
    requestAnimationFrame(function(){ sc.scrollTop = sc.scrollHeight; });
  }
}

/* swipe up on the home indicator */
(function(){
  var bar = $("hbar"), y0 = null;
  bar.addEventListener("pointerdown", function(e){ y0 = e.clientY; bar.setPointerCapture(e.pointerId); });
  bar.addEventListener("pointerup", function(e){
    var moved = y0 == null ? 0 : y0 - e.clientY;
    y0 = null;
    if(current !== "home" && (moved > 18 || moved <= 4)) go("home");
  });
  bar.addEventListener("pointercancel", function(){ y0 = null; });
})();

function renderBoard(){
  $("clock").textContent = DATA.phone.clock;

  $("galName").textContent = B.gal;

  $("foot").innerHTML = '<div class="g">' + B.footer + '</div>';
  $("tick").innerHTML = '<span class="d">' + esc(B.tickLabel) + '</span>'
    + B.ticker.map(function(g){
        var hw = Number(g.hs) > Number(g.as), aw = Number(g.as) > Number(g.hs);

function renderRail(){

    if(c === activeCat) b.className = "on";
    b.addEventListener("click", function(){ activeCat = c; renderRail(); renderRows(); });
    rail.appendChild(b);

}
function renderRows(){
  var el = $("rows"); el.innerHTML = "";
  DATA.posts.forEach(function(p, i){
    if(p.gone){
      if(activeCat !== "전체") return;
      var g = document.createElement("div");
      g.className = "row gone";
      g.innerHTML = '<span class="l1">관리자에 의해 삭제된 게시물입니다</span>'
        + '<span class="l2"><span>' + esc(p.time) + '</span></span>';
      el.appendChild(g);
      return;
    }
    if(activeCat !== "전체" && p.cat !== activeCat) return;

    b.className = "row" + (p.hot ? " hot" : "") + (read[i] ? " read" : "");
    b.innerHTML = '<span class="l1"><span class="cat">' + esc(p.cat) + '</span>'
      + (p.hot ? '<span class="flag">개념</span>' : '')
      + esc(p.title) + '<span class="cm">[' + (p.cms ? p.cms.length : 0) + ']</span></span>'
      + '<span class="l2"><span>' + esc(p.nick) + '(' + esc(p.ip) + ')</span>'
      + '<span>' + esc(p.time) + '</span>'
      + '<span class="n">조회 ' + nf(p.views) + '</span>'
      + '<span class="n v">추천 ' + nf(p.votes) + '</span></span>';
   if(p.lock) b.classList.add("lock");

function openPost(i){
  var p = DATA.posts[i];
  if(!read[i]){ read[i] = true; opened++; }
  var cms = (p.cms || []).map(function(c){
    return '<div class="cmt' + (c.adm ? " adm" : "") + (c.op ? " op" : "") + (c.re ? " re" : "") + '">'
      + '<div class="h"><span class="nk">' + esc(c.n) + (c.i ? "(" + esc(c.i) + ")" : "") + '</span>'
      + '<span class="tm">' + esc(c.tm) + '</span></div>'
      + '<div class="tx">' + esc(c.t) + '</div></div>';
  }).join("");

  $("postView").innerHTML =
    '<div class="pbar gut"><button id="pbBack"><svg width="9" height="15" viewBox="0 0 10 17" aria-hidden="true"><path d="M9 1L1.5 8.5 9 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>목록</button><span class="ttl">' + esc(B.gal) + '</span></div>'
    + '<div class="gut"><div class="ph"><span class="cat">' + esc(p.cat) + '</span>'
      + (p.hot ? '<span class="kn">개념글</span>' : '')
      + '<h2>' + esc(p.title) + '</h2><div class="m"><span class="w">' + esc(p.nick) + '(' + esc(p.ip) + ')</span>'
      + '<span>' + esc(B.date) + ' ' + esc(p.time) + '</span>'
      + '<span class="n">조회 ' + nf(p.views) + '</span><span class="n">추천 ' + nf(p.votes) + '</span></div></div>'
      + '<div class="pb">' + esc(p.body) + '</div>'
      + '<div class="vt"><button class="up" id="upBtn"><b id="upN">' + nf(p.votes) + '</b>추천</button>'
            + '<button><b>' + nf(p.down != null ? p.down : Math.round((p.votes || 0) * 0.07) + 2) + '</b>비추천</button></div></div>'
    + '<div class="cw"><div class="gut"><div class="ch">전체 댓글 <b>' + (p.cms ? p.cms.length : 0) + '</b>개</div>'
      + cms + '<div class="cmt" style="color:#aab0bb"><div class="tx">댓글 작성은 로그인 후 이용할 수 있습니다.</div></div></div></div>'
    + '<div class="gut"><div class="cnav"><button id="pPrev">이전글</button><button id="pList">목록</button><button id="pNext">다음글</button></div></div>';

  $("listView").hidden = true; $("postView").hidden = false;
  SCREENS.browser.scrollTop = 0;
  $("urlTxt").textContent = B.url + "/board/" + p.no;

  var up = $("upBtn");
  up.addEventListener("click", function(){
    if(up.classList.contains("done")) return;
    up.classList.add("done");
    $("upN").textContent = nf((p.votes || 0) + 1);
  });
  $("pbBack").addEventListener("click", toList);
  $("pList").addEventListener("click", toList);
  // lock 걸린 글과 삭제된 글은 이전/다음글 이동에서 제외
  var reals = [];
  DATA.posts.forEach(function(x, j){ if(!x.gone && !x.lock) reals.push(j); });
  var ri = reals.indexOf(i);
  var prev = ri > 0 ? reals[ri - 1] : null;
  var next = (ri > -1 && ri < reals.length - 1) ? reals[ri + 1] : null;
  if(prev === null) $("pPrev").disabled = true;
  else $("pPrev").addEventListener("click", function(){ openPost(prev); });
  if(next === null) $("pNext").disabled = true;
  else $("pNext").addEventListener("click", function(){ openPost(next); });

  if(opened >= (T.afterPosts || 3)) showNotif();
}
function toList(){
    $("postView").hidden = true; $("writeView").hidden = true; $("listView").hidden = false;
  SCREENS.browser.scrollTop = 0;
  $("urlTxt").textContent = B.url;
  renderRows();
}

function randIp(){
  var head = [118, 175, 211, 121, 223, 39, 182, 156, 1, 125, 114, 222];
  return head[Math.floor(Math.random() * head.length)] + "." + (Math.floor(Math.random() * 253) + 1);
}

$("wSubmit").addEventListener("click", function(){

    if(p.no) maxNo = Math.max(maxNo, parseInt(p.no, 10) || 0);
  });

  DATA.posts.unshift({
    no:    String(maxNo + 1),
    cat:   wCat,
    title: title,
    nick:  $("wNick").value.trim() || "ㅇㅇ",
    ip:    randIp(),
    time:  DATA.phone.clock,
    views: 1,
    votes: 0,
    down:  0,
    body:  body,
    cms:   []
  });

/* ─────────── notification ─────────── */
var KICON = '<svg width="24" height="24" viewBox="0 0 32 32"><path d="M16 7c5.5 0 10 3.3 10 7.5S21.5 22 16 22c-.8 0-1.6-.1-2.3-.2l-4.4 2.6.9-3.6C8 19.5 6 17.2 6 14.5 6 10.3 10.5 7 16 7z" fill="#3c1e1e"/></svg>';
var notifIdx = 0;
var NOTIF_GAP = 2000;   // ← 메시지 사이 간격(밀리초). 2000 = 2초

function showNotif(){
  if(notified || talkSeen) return;
  notified = true;
  pushNext();
}
function pushNext(){
  if(talkSeen) return;
  var n = $("notif");
  if(notifIdx >= T.msgs.length){
    clearTimeout(showNotif._t);
    showNotif._t = setTimeout(hideNotif, 9000);
    return;
  }
  var m = T.msgs[notifIdx++];
  var paint = function(){
    $("notifIc").innerHTML = KICON;
    $("notifTx").textContent = T.name + ": " + m.t;
    n.hidden = false;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ n.classList.add("in"); }); });
  };
  if(n.classList.contains("in")){
    n.classList.remove("in");
    setTimeout(paint, 260);
  } else {
    paint();
  }
  clearTimeout(showNotif._t);
  showNotif._t = setTimeout(pushNext, NOTIF_GAP);
}
function hideNotif(){
  clearTimeout(showNotif._t);
  $("notif").classList.remove("in");
  setTimeout(function(){ $("notif").hidden = true; }, 500);
}
$("notif").addEventListener("click", function(){ go("talk"); });
(function(){
  var n = $("notif"), y0 = null;
  n.addEventListener("pointerdown", function(e){ y0 = e.clientY; });
  n.addEventListener("pointerup", function(e){
    if(y0 != null && y0 - e.clientY > 24){ e.preventDefault(); e.stopPropagation(); hideNotif(); }
    y0 = null;
  });
})();
setTimeout(showNotif, (T.afterSeconds || 115) * 1000);

/* ─────────── messenger ─────────── */
var talkBuilt = false;
var AVATAR = '<svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" fill="#b9c6d4"/><circle cx="20" cy="15.5" r="6.4" fill="#fff"/><path d="M6.5 40c1.6-7.6 7-11.6 13.5-11.6S32 32.4 33.5 40z" fill="#fff"/></svg>';

function renderMsgs(list){
  var out = "", prevMine = null;
  list.forEach(function(m){
    var mine = !!m.me, first = (mine !== prevMine);
    prevMine = mine;
    if(mine){
      out += '<div class="kmsg me"><span class="col"><span class="ln">'
        + '<span class="kbub">' + esc(m.t) + '</span>'
        + '<span class="mt"><span class="tm">' + esc(m.tm) + '</span></span>'
        + '</span></span></div>';
    } else {
      out += '<div class="kmsg' + (first ? "" : " cont") + '">'
        + (first ? '<span class="av">' + AVATAR + '</span>' : '')
        + '<span class="col">' + (first ? '<span class="nm">' + esc(T.name) + '</span>' : '')
        + '<span class="ln"><span class="kbub">' + esc(m.t) + '</span>'
        + '<span class="tm">' + esc(m.tm) + '</span></span></span></div>';
    }
  });
  return out;
}

function buildTalk(){
  if(talkBuilt) return;
  talkBuilt = true;
  $("kName").textContent = T.name;
  var html = "";
  (T.days || []).forEach(function(d){
    if(!d.msgs || !d.msgs.length) return;
    html += '<div class="kdate">' + esc(d.date) + '</div>' + renderMsgs(d.msgs);
  });
  html += '<div class="kdate">' + esc(T.date) + '</div>' + renderMsgs(T.msgs);
  $("kMsgs").innerHTML = html;
}
var kDraft = $("kDraft"), kSend = $("kSend");
kDraft.addEventListener("input", function(){
  kDraft.style.height = "auto";
  kDraft.style.height = Math.min(88, kDraft.scrollHeight) + "px";
  kSend.classList.toggle("live", kDraft.value.trim().length > 0);
});
kDraft.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("kForm").requestSubmit(); }
});
$("kForm").addEventListener("submit", function(e){
  e.preventDefault();
  var v = kDraft.value.trim(); if(!v) return;
  var d = document.createElement("div");
  d.className = "kmsg me";
  d.innerHTML = '<span class="col"><span class="ln"><span class="kbub"></span>'
    + '<span class="mt"><span class="un">1</span><span class="tm">' + esc(T.myTime) + '</span></span></span></span>';
  d.querySelector(".kbub").textContent = v;
  $("kMsgs").appendChild(d);
  kDraft.value = ""; kDraft.style.height = "auto"; kSend.classList.remove("live");
  SCREENS.talk.scrollTop = SCREENS.talk.scrollHeight;
});
$("kBack").addEventListener("click", function(){ go("home"); });

/* 주소창 뒤로가기: 글이 열려 있으면 목록으로, 목록이면 홈으로 */
$("cbBack").addEventListener("click", function(){

  else if($("postView").hidden) go("home");
  else toList();
});

/* 옆으로 쓸면 홈으로 */
(function(){
  var st = document.querySelector(".stage");
  var x0 = null, y0 = null, swiped = false;
    st.addEventListener("pointerdown", function(e){
    if(e.target.closest("input,textarea") || !$("writeView").hidden){ x0 = null; return; }
    x0 = e.clientX; y0 = e.clientY; swiped = false;
  }, true);
  st.addEventListener("pointerup", function(e){
    if(x0 == null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if(current !== "home" && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6){
      swiped = true;
      go("home");
    }
  }, true);
  st.addEventListener("pointercancel", function(){ x0 = null; }, true);
  st.addEventListener("click", function(e){
    if(swiped){ e.stopPropagation(); e.preventDefault(); swiped = false; }
  }, true);
})();
